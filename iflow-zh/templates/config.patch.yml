# Merged into ~/.omp/agent/config.yml by iflow-zh's /sc:setup (or `npx iflow-zh`).
#
# Concrete models stay user-controlled: every value here is an omp built-in
# Role alias, so `/model` remains the single place where providers are chosen.
# The merge is key-wise — pre-existing overrides for other agents survive.

modelRoles:
  # The interactive parent session dispatches; give it the strong reasoning Role.
  default: "@slow"

task:
  agentModelOverrides:
    # The coordinator Agent, when explicitly spawned, uses the strong Role.
    universal-omni-agent-v8: "@slow"

    # Fast, bounded, read-oriented work.
    sonic: "@smol"
    scout: "@smol"

    # Concrete implementation and routine documentation work.
    task: "@task"
    technical-writer: "@task"
    learning-guide: "@task"
    socratic-mentor: "@task"
    python-expert: "@task"
    frontend-architect: "@task"
    devops-architect: "@task"
    requirements-analyst: "@task"
    refactoring-expert: "@task"

    # High-risk reasoning, review, and cross-module work.
    reviewer: "@slow"
    security-reviewer: "@slow"
    system-architect: "@slow"
    backend-architect: "@slow"
    security-engineer: "@slow"
    root-cause-analyst: "@slow"
    performance-engineer: "@slow"
    quality-engineer: "@slow"
